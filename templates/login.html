<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>FinBoard — Login</title>
</head>
<body>
    <div class="container">
        <div class="logo">💳 FinBoard</div>
        <h2>Login to Your Account</h2>
        <p class="subtitle">Enter your credentials to continue.</p>

        {% if registered %}
        <div style="background:#e8f5e9;border:1px solid #2e7d32;color:#1b5e20;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;">
            ✅ Account created! Please login.
        </div>
        {% endif %}

        {% if error %}
        <div style="background:#fde8e8;border:1px solid #c0392b;color:#7b1a1a;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;">
            ❌ {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="input-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" name="loginEmail" placeholder="you@example.com" required>
            </div>
            <div class="input-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a></p>
    </div>
</body>
</html>
